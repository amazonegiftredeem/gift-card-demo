```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Login </title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #fafafa;
  min-height: 100vh;
  display: flex;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 420px;
  padding: 20px;
  margin-top: 55px;
}

.login-box {
  background: white;
  border: 1px solid #ddd;
  padding: 38px 45px 25px;
  text-align: center;
}

/* Instagram Logo */
.logo {
  width: 75px;
  height: 75px;
  margin: 0 auto 28px;
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

input {
  width: 100%;
  height: 44px;
  margin-bottom: 11px;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 5px;
  background: #fafafa;
  font-size: 13px;
}

button {
  width: 100%;
  height: 41px;
  border: none;
  border-radius: 5px;
  background: #3797e8;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 2px;
}

.or {
  display: flex;
  align-items: center;
  gap: 15px;
  color: #888;
  margin: 27px 0;
}

.or::before,
.or::after {
  content: "";
  flex: 1;
  height: 1px;
  background: #ddd;
}

.social {
  color: #385185;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 25px;
}

.forgot {
  font-size: 12px;
  color: #385185;
  margin-bottom: 3px;
}

.signup {
  background: white;
  border: 1px solid #ddd;
  padding: 28px 10px;
  margin-top: 12px;
  text-align: center;
  font-size: 14px;
}

.signup a {
  color: #3797e8;
  font-weight: bold;
  text-decoration: none;
}

.footer {
  margin-top: 35px;
  text-align: center;
  font-size: 12px;
  color: #555;
  line-height: 2.2;
}

.demo-note {
  font-size: 11px;
  color: #888;
  margin-top: 18px;
}

</style>
</head>

<body>

<div class="container">

  <div class="login-box">

    <!-- Instagram Logo -->
    <div class="logo">
      <img src="Instagram_logo_2022.svg" alt="Instagram Logo">
    </div>

    <form onsubmit="event.preventDefault();
      alert(' account credentials were collected.');">

      <input
        type="text"
        placeholder="Demo username or email"
        required>

      <input
        type="password"
        placeholder=" password"
        required>

      <button type="submit">Log In</button>

    </form>

    <div class="or">OR</div>

    <div class="social">
      ● Continue with  Account
    </div>

    <div class="forgot">
      Forgot password?
    </div>

    <p class="demo-note">
      DEMONSTRATION LOGIN PAGE
    </p>

  </div>

  <div class="signup">
    Don't have an account?
    <a href="#" onclick="alert(' sign-up page')">
      Sign Up
    </a>
  </div>

  <div class="footer">
    About &nbsp; Blog &nbsp; Help &nbsp;
    Privacy &nbsp; Terms &nbsp; Contact
    <br>
     Social © 2026
  </div>

</div>

</body>
</html>
```
