
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gift Card </title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #d1d5d6;
    font-family: Arial, sans-serif;
}

.phone {
    width: 100%;
    max-width: 485px;
    min-height: 100vh;
    margin: auto;
    background: #f5f0ef;
    position: relative;
    padding-bottom: 80px;
}

/* TOP HEADER */

.header {
    height: 75px;
    background: #ed8500;
    border-bottom: 4px solid #8c008c;
    display: flex;
    align-items: center;
    padding: 10px 15px;
    gap: 13px;
}

.icon {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: white;
}

.back {
    width: 25px;
}

.search {
    height: 48px;
    flex: 1;
    background: white;
    border-radius: 11px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
    min-width: 0;
}

.search span {
    flex: 1;
    font-size: 14px;
    color: #777;
    white-space: nowrap;
    overflow: hidden;
}

.search svg {
    flex-shrink: 0;
}

.header-icon {
    width: 24px;
}

/* MAIN CONTENT */

.content {
    padding: 14px 20px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #ddd;
    padding-bottom: 17px;
}

.logo {
    font-size: 26px;
    font-weight: bold;
    color: #222;
}

.logo span {
    color: #ed8500;
}

.subtitle {
    font-size: 17px;
    color: #666;
    margin-top: 8px;
}

.amount {
    font-size: 31px;
    font-weight: bold;
}

/* GIFT CARD */

.gift-card {
    width: 100%;
    height: 275px;
    margin-top: 23px;
    padding: 7px;
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 5px 18px #ddd;
}

.card-design {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #ff7600, #f45a00);
    border: 3px solid #fff;
    border-radius: 20px;
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Decorative gift ribbons */

.ribbon {
    position: absolute;
    width: 150px;
    height: 150px;
    border: 13px solid rgba(180, 65, 0, .28);
    border-radius: 50%;
}

.ribbon.one {
    top: -65px;
    right: -35px;
}

.ribbon.two {
    bottom: -80px;
    left: -55px;
}

.ribbon::before,
.ribbon::after {
    content: "";
    position: absolute;
    width: 65px;
    height: 40px;
    border: 10px solid rgba(180, 65, 0, .28);
    border-radius: 50%;
    top: 30px;
}

.ribbon::before {
    left: -55px;
    transform: rotate(35deg);
}

.ribbon::after {
    right: -55px;
    transform: rotate(-35deg);
}

/* Decorative smile arrow */

.smile {
    width: 210px;
    height: 90px;
    position: relative;
    z-index: 2;
}

.smile svg {
    width: 100%;
    height: 100%;
}

.card-label {
    position: absolute;
    right: 15px;
    bottom: 14px;
    color: white;
    font-size: 13px;
    text-align: right;
    font-weight: bold;
    z-index: 3;
}

/* REDEEM BUTTON */

.redeem {
    width: 100%;
    height: 55px;
    margin-top: 26px;
    background: #f4c900;
    border: none;
    border-radius: 35px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 9px #ddd;
}

/* BOTTOM NAVIGATION */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 485px;
    height: 65px;
    background: #fafafa;
    border-top: 1px solid #ddd;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 100;
}

.nav-item {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 3px;
    color: #666;
    font-size: 12px;
    position: relative;
}

.nav-item svg {
    width: 24px;
    height: 24px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.nav-item.active {
    color: #16899a;
    border-bottom: 3px solid #16899a;
}

.badge {
    position: absolute;
    top: 4px;
    right: 22%;
    width: 17px;
    height: 17px;
    background: #ed8500;
    color: white;
    font-size: 10px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.dot {
    position: absolute;
    top: 9px;
    right: 25%;
    width: 8px;
    height: 8px;
    background: #e21c44;
    border-radius: 50%;
}

/* RESPONSIVE */

@media(max-width: 400px) {
    .header {
        gap: 8px;
        padding: 10px;
    }

    .search span {
        font-size: 12px;
    }

    .content {
        padding: 14px;
    }

    .gift-card {
        height: 235px;
    }

    .amount {
        font-size: 27px;
    }
}

</style>
</head>
