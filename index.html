<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gift Card </title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #d1d5d6;
    font-family: Arial, sans-serif;
}

.phone {
    width: 100%;
    max-width: 485px;
    min-height: 100vh;
    margin: auto;
    background: #f5f0ef;
    position: relative;
    padding-bottom: 75px;
}

/* TOP HEADER */

.header {
    height: 75px;
    background: #ed8500;
    display: flex;
    align-items: center;
    padding: 10px 15px;
    gap: 14px;
    border-bottom: 4px solid #8c008c;
}

.back {
    width: 30px;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
}

.search {
    background: #fff;
    border-radius: 10px;
    height: 48px;
    flex: 1;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
    color: #777;
}

.search-text {
    flex: 1;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
}

.search svg {
    flex-shrink: 0;
}

.header-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    flex-shrink: 0;
}

/* CONTENT */

.content {
    padding: 12px 20px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #ddd;
    padding-bottom: 18px;
}

.logo {
    font-size: 27px;
    font-weight: bold;
    color: #222;
}

.logo span {
    color: #ed8500;
}

.subtitle {
    font-size: 17px;
    color: #666;
    margin-top: 8px;
}

.amount {
    font-size: 32px;
    font-weight: bold;
}

/* GIFT CARD */

.gift-card {
    height: 270px;
    margin-top: 24px;
    border-radius: 25px;
    background: linear-gradient(135deg,#ff7900,#e65300);
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 5px 15px #ccc;
    overflow: hidden;
    border: 5px solid white;
}

.gift-card::before {
    content: "AMAZON";
    position: absolute;
    font-size: 85px;
    color: rgba(255,255,255,.13);
    transform: rotate(-25deg);
    font-weight: bold;
}

.smile {
    color: white;
    font-size: 100px;
    position: relative;
}

.card-text {
    position: absolute;
    right: 15px;
    bottom: 15px;
    color: white;
    font-size: 14px;
    text-align: right;
}

/* REDEEM BUTTON */

.redeem {
    width: 100%;
    height: 55px;
    margin-top: 28px;
    background: #f4c900;
    border: none;
    border-radius: 35px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 8px #ddd;
}

/* BOTTOM NAVIGATION */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 485px;
    height: 65px;
    background: #fafafa;
    border-top: 1px solid #ddd;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 100;
}

.nav-item {
    flex: 1;
    text-align: center;
    color: #666;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    height: 100%;
}

.nav-item svg {
    width: 24px;
    height: 24px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.nav-item.active {
    color: #16899a;
}

/* MOBILE */

@media(max-width: 485px) {
    .phone {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="phone">

<!-- HEADER -->

<header class="header">

    <!-- BACK ARROW -->
    <div class="back">
        <svg width="27" height="27" viewBox="0 0 24 24"
        fill="none" stroke="white" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/>
            <path d="M12 19L5 12L12 5"/>
        </svg>
    </div>

    <!-- SEARCH BAR -->
    <div class="search">

        <!-- SEARCH ICON -->
        <svg width="21" height="21" viewBox="0 0 24 24"
        fill="none" stroke="#555" stroke-width="2.2"
        stroke-linecap="round">
            <circle cx="10.5" cy="10.5" r="6.5"/>
            <path d="M16 16L21 21"/>
        </svg>

        <span class="search-text">
            Search or ask a question...
        </span>

        <!-- CAMERA ICON -->
        <svg width="22" height="22" viewBox="0 0 24 24"
        fill="none" stroke="#555" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7H7L9 4H15L17 7H20V19H4Z"/>
            <circle cx="12" cy="13" r="3.5"/>
        </svg>

    </div>

    <!-- MICROPHONE -->
    <div class="header-icon">
        <svg width="23" height="27" viewBox="0 0 24 24"
        fill="none" stroke="white" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="13" rx="3"/>
            <path d="M5 11V12A7 7 0 0 0 19 12V11"/>
            <path d="M12 19V23"/>
            <path d="M9 23H15"/>
        </svg>
    </div>

    <!-- QR SCANNER -->
    <div class="header-icon">
        <svg width="24" height="27" viewBox="0 0 24 24"
        fill="none" stroke="white" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">

            <path d="M3 8V4H8"/>
            <path d="M16 4H21V9"/>
            <path d="M21 16V20H16"/>
            <path d="M8 20H3V15"/>

            <rect x="7" y="7" width="10" height="10" rx="1"/>
            <path d="M10 10H14V14H10Z"/>
        </svg>
    </div>

</header>


<!-- MAIN CONTENT -->

<main class="content">

    <div class="top">

        <div>
            <div class="logo">
                Sample<span>Pay</span>
            </div>

            <div class="subtitle">
                gift card 
            </div>
        </div>

        <div class="amount">₹500</div>

    </div>


    <div class="gift-card">

        <div class="smile">⌣</div>

        <div class="card-text">
            SAMPLEPAY<br>
            GIFT CARD
        </div>

    </div>


    <button class="redeem"
    onclick="window.location.href='login.html'">

        Redeem Gift Card

    </button>

</main>


<!-- BOTTOM NAVIGATION -->

<nav class="bottom-nav">

    <!-- HOME -->
    <div class="nav-item">

        <svg viewBox="0 0 24 24">
            <path d="M3 10L12 3L21 10V21H3Z"/>
            <path d="M9 21V13H15V21"/>
        </svg>

        Home
    </div>


    <!-- YOU -->
    <div class="nav-item">

        <svg viewBox="0 0 24 24">
            <circle cx="12" cy="7" r="4"/>
            <path d="M5 21V19A7 7 0 0 1 19 19V21"/>
        </svg>

        You
    </div>


    <!-- WALLET -->
    <div class="nav-item active">

        <svg viewBox="0 0 24 24">
            <rect x="2" y="5" width="20" height="15" rx="2"/>
            <path d="M2 9H22"/>
            <rect x="8" y="12" width="8" height="5" rx="1"/>
        </svg>

        Wallet
    </div>


    <!-- CART -->
    <div class="nav-item">

        <svg viewBox="0 0 24 24">
            <path d="M2 3H4L7 16H19L22 7H6"/>
            <circle cx="9" cy="21" r="1.5"/>
            <circle cx="18" cy="21" r="1.5"/>
        </svg>

        Cart

    </div>


    <!-- BROWSE -->
    <div class="nav-item">

        <svg viewBox="0 0 24 24">
            <path d="M3 6H21"/>
            <path d="M3 12H21"/>
            <path d="M3 18H21"/>
        </svg>

        Browse

    </div>


    <!-- RUFUS -->
    <div class="nav-item">

        <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <circle cx="9" cy="10" r="1"/>
            <circle cx="15" cy="10" r="1"/>
            <path d="M8 15Q12 19 16 15"/>
        </svg>

        Rufus

    </div>

</nav>

</div>

</body>
</html>
