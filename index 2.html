```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SamplePay Gift Card Demo</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #d1d5d6;
    font-family: Arial, sans-serif;
}

.phone {
    width: 100%;
    max-width: 485px;
    min-height: 100vh;
    margin: auto;
    background: #f5f0ef;
    position: relative;
    padding-bottom: 80px;
}

/* HEADER */

.header {
    height: 80px;
    background: #ed8500;
    display: flex;
    align-items: center;
    padding: 10px 15px;
    gap: 14px;
    border-bottom: 4px solid #8c008c;
}

.back {
    color: white;
    font-size: 28px;
}

.search {
    background: white;
    border-radius: 10px;
    height: 48px;
    flex: 1;
    display: flex;
    align-items: center;
    padding: 12px;
    font-size: 15px;
    color: #777;
}

/* CONTENT */

.content {
    padding: 12px 20px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #ddd;
    padding-bottom: 18px;
}

.logo {
    font-size: 27px;
    font-weight: bold;
    color: #222;
}

.logo span {
    color: #ed8500;
}

.subtitle {
    font-size: 17px;
    color: #666;
    margin-top: 8px;
}

.amount {
    font-size: 32px;
    font-weight: bold;
}

/* GIFT CARD IMAGE */

.gift-card {
    width: 100%;
    margin-top: 24px;
    border-radius: 20px;
    overflow: hidden;
    background: #ff6500;
    box-shadow: 0 5px 15px #ccc;
}

.gift-card img {
    width: 100%;
    height: auto;
    display: block;
}

/* REDEEM BUTTON */

.redeem {
    width: 100%;
    height: 55px;
    margin-top: 28px;
    background: #f4c900;
    border: none;
    border-radius: 35px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

/* BOTTOM NAVIGATION */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 485px;
    height: 65px;
    background: #fafafa;
    border-top: 1px solid #ddd;
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.nav-item {
    flex: 1;
    text-align: center;
    color: #666;
    font-size: 12px;
}

.nav-item.active {
    color: #16899a;
}

.demo-note {
    text-align: center;
    font-size: 11px;
    color: #777;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="phone">

<!-- HEADER -->

<header class="header">
    <div class="back">←</div>
    <div class="search">⌕ &nbsp; Search or ask a question...</div>
    <div style="color:white;font-size:23px;">♩</div>
    <div style="color:white;font-size:23px;">▣</div>
</header>

<!-- CONTENT -->

<main class="content">

    <div class="top">
        <div>
            <div class="logo">Sample<span>Pay</span></div>
            <div class="subtitle">Gift Card Demo</div>
        </div>

        <div class="amount">₹500</div>
    </div>

    <!-- GIFT CARD IMAGE -->

    <div class="gift-card">
        <img
            src="gift-card.png"
            alt="Gift Card Demo"
        >
    </div>

    <!-- REDEEM BUTTON -->

    <button class="redeem"
    onclick="window.location.href='login.html'">
        Redeem Gift Card
    </button>

    <div class="demo-note">
        SamplePay demonstration website
    </div>

</main>

<!-- BOTTOM NAVIGATION -->

<nav class="bottom-nav">

    <div class="nav-item">⌂<br>Home</div>
    <div class="nav-item">♙<br>You</div>
    <div class="nav-item active">▣<br>Wallet</div>
    <div class="nav-item">🛒<br>Cart</div>
    <div class="nav-item">☰<br>Browse</div>
    <div class="nav-item">☺<br>Rufus</div>

</nav>

</div>

</body>
</html>
```
